name: release

# Pushing a tag like v0.2.0 builds the binaries and publishes a GitHub release.
# A tag with a hyphen (v0.2.0-rc.1) is published as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A flake cannot read git tags, so the version is written in flake.nix
      # (`just bump <version>`) and the release fails if it does not match.
      - name: flake.nix version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -qF "version = \"${TAG#v}\";" flake.nix; then
            echo "::error::flake.nix version is not ${TAG#v}. Run 'just bump ${TAG#v}', commit, and tag that commit."
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="$(mktemp -d)"
            bin=tasked
            if [ "$os" = windows ]; then bin=tasked.exe; fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/n3tw0rth/tasked/cmd.version=${VERSION}" \
              -o "$stage/$bin" .
            cp LICENSE README.md "$stage/"

            # Asset names carry no version, so
            # releases/latest/download/<name> always points at the newest one.
            name="tasked_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" *)
            else
              tar -C "$stage" -czf "dist/$name.tar.gz" "$bin" LICENSE README.md
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* \
            --verify-tag --generate-notes --title "$TAG" "${flags[@]}"
